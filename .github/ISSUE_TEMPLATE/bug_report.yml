name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: Prompt or call that triggered it
      description: >
        The exact natural-language prompt, CLI command, or API call. If the agent
        generated Python, paste it — it is saved in your workspace directory.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HelioAI version
      description: "`helioai --version`, or the commit SHA if running from source."
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options: [azure, groq, gemini, ollama, other]
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "3.12.4 on Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback or logs
      render: text

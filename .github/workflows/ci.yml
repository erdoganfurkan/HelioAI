name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  phep3:
    # PyHC PHEP 3: Python versions supported for 36 months, upstream core
    # Scientific Python packages for 24, both adopted within 6 of release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: heliophysicsPy/pyhc-actions/phep3-compliance@v1

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    # Windows is reported but not gating. The sandbox's real isolation is
    # bubblewrap, which is Linux-only; elsewhere run_python degrades to a plain
    # subprocess (see SECURITY.md). Testing Windows tells us the truth about that
    # path without pretending it is a supported deployment target yet.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-minilm-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-minilm-${{ matrix.os }}-${{ matrix.python-version }}-
            hf-minilm-${{ matrix.os }}-

      # The warmup must run with the SAME env as the sandbox subprocess it warms:
      # a different HOME/XDG means a different cache, so the warmup would heat a
      # cache the sandbox never reads. Bash heredoc, hence POSIX only.
      - name: Warm up sandbox imports (.pyc + speasy inventory cache)
        if: runner.os != 'Windows'
        env:
          HOME: /tmp
          XDG_CACHE_HOME: /tmp/.cache
          XDG_DATA_HOME: /tmp/.local/share
          XDG_CONFIG_HOME: /tmp/.config
        run: |
          .venv/bin/python - << 'PYEOF'
          import os; os.environ['MPLBACKEND'] = 'Agg'
          import numpy, matplotlib; matplotlib.use('Agg')
          import matplotlib.pyplot
          import scipy, scipy.signal, scipy.stats, scipy.fft
          import astropy, astropy.units
          try:
              import speasy
          except Exception:
              pass
          try:
              import plasmapy, plasmapy.formulary
          except Exception:
              pass
          PYEOF

      - name: Run tests
        env:
          HELIOAI_LLM_PROVIDER: groq
          GROQ_API_KEY: ci-placeholder
        run: uv run pytest --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

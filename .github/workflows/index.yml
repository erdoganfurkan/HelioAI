name: Index

# Builds the parameter index from scratch and publishes it on the Hugging Face Hub,
# where `helioai index` fetches it instead of spending the better part of an hour
# building one. A release tag publishes that release's index and tags it; a manual run
# refreshes `main`, the snapshot a development install gets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HELIOAI_DATA_DIR: ${{ github.workspace }}/.index-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync

      - name: Build the index from scratch
        run: .venv/bin/helioai index --rebuild

      - name: Export the snapshot
        run: .venv/bin/helioai index --export snapshot

      - name: Publish to the Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          .venv/bin/python -c "
          import os
          from helioai.config import settings
          from helioai.index_snapshot import publish_index
          print(publish_index('snapshot', settings.rag.index_repo, os.environ['TAG'] or None))
          "

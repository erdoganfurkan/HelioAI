services:
  helioai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Loopback only: the image ships no authentication and run_python executes
      # model-written code, so "7890:7890" published that on every interface of the
      # host. Put auth in front of it before widening this.
      - "127.0.0.1:7890:7890"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    restart: unless-stopped

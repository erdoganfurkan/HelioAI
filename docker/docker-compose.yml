services:
  helioai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Loopback only: the image ships no authentication and run_python executes
      # model-written code, so "7890:7890" published that on every interface of the
      # host. Put auth in front of it before widening this.
      - "127.0.0.1:7890:7890"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    environment:
      # The container has to bind 0.0.0.0 inside its own network namespace; the port
      # above is published on the host's loopback only, so this opt-out is safe here
      # and nowhere else. Set HELIOAI_USERS in .env before widening the publish.
      HELIOAI_ALLOW_UNAUTHENTICATED_PUBLIC: "1"
    restart: unless-stopped

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelioAI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <h1>Helio<span>AI</span></h1>

      <div>
        <label for="provider-select">LLM Provider</label>
        <select id="provider-select">
          <option value="opencode">OpenCode</option>
          <option value="groq">Groq</option>
          <option value="gemini">Gemini</option>
          <option value="azure">Azure OpenAI</option>
          <option value="ollama">Ollama (local)</option>
        </select>
      </div>

      <button class="btn-new" id="btn-new">+ New session</button>

      <div class="dev-token-row" id="token-row" hidden>
        <label for="dev-token-input" id="token-label">Dev token</label>
        <div class="dev-token-wrap">
          <input type="password" id="dev-token-input" placeholder="(optional)" autocomplete="off" />
          <span class="dev-indicator" id="dev-indicator" title="No token">●</span>
        </div>
      </div>

      <button class="btn-profile" id="btn-profile" title="Notes the agent reads with every question">Profile</button>

      <div>
        <label>Sessions</label>
        <div class="session-list" id="session-list">
          <span class="empty">No sessions yet</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="btn-menu" id="btn-menu" aria-label="Show sessions" aria-controls="sidebar">☰</button>
        <span class="topbar-title">Helio<span>AI</span></span>
      </div>
      <div class="chat-area" id="chat-area"></div>

      <div class="activity-dock collapsed" id="activity-dock">
        <div class="ad-header" id="ad-header">
          <span class="ad-toggle">▸</span>
          <span class="ad-title">Activity</span>
          <span class="ad-summary" id="ad-summary"></span>
        </div>
        <div class="ad-body" id="ad-body"></div>
      </div>

      <div class="input-bar">
        <textarea id="input" placeholder="Ask a heliophysics question…" rows="1" aria-label="Your question"></textarea>
        <button class="btn-send" id="btn-send">Send</button>
        <button class="btn-cancel" id="btn-cancel" style="display:none">✕ Cancel</button>
      </div>
    </main>

    <aside class="code-panel" id="code-panel">
      <div class="cp-header">
        <span class="cp-title">Generated code</span>
        <span class="cp-actions">
          <button class="cp-copy" id="cp-copy" title="Copy the code">Copy</button>
          <button class="cp-close" id="cp-close" aria-label="Close the code panel">✕</button>
        </span>
      </div>
      <pre class="cp-body"><code id="code-content"></code></pre>
    </aside>
  </div>

  <div id="lightbox" class="lightbox">
    <div class="lb-backdrop" id="lb-backdrop"></div>
    <div class="lb-inner">
      <img id="lb-img" src="" alt="Figure" />
      <div class="lb-bar">
        <a id="lb-download" href="" download="figure.png" class="btn-lb-dl">↓ PNG</a>
        <a id="lb-pdf" href="" download="figure.pdf" class="btn-lb-dl">↓ PDF</a>
        <button id="lb-close" class="btn-lb-close" aria-label="Close the figure">✕</button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title" hidden>
    <div class="modal-backdrop" id="profile-backdrop"></div>
    <div class="modal-inner">
      <h2 id="profile-title">Your profile</h2>
      <p class="modal-hint">Read by the agent with every question: your field, the missions
        and coordinate frames you work in, the units you prefer, the language to answer in.</p>
      <textarea id="profile-text" rows="10" placeholder="e.g. I study magnetosheath turbulence with MMS. Prefer GSE, nT and km/s. Answer in French."></textarea>
      <div class="modal-bar">
        <span class="modal-status" id="profile-status"></span>
        <button class="btn-secondary" id="profile-cancel">Cancel</button>
        <button class="btn-primary" id="profile-save">Save</button>
      </div>
    </div>
  </div>

  <link href="/static/vendor/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="/static/vendor/prism.min.js"></script>
  <script src="/static/vendor/prism-python.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

site_name: HelioAI
site_description: AI agent for heliophysics and space plasma data analysis
site_url: https://erdoganfurkan.github.io/HelioAI/
repo_url: https://github.com/erdoganfurkan/HelioAI
repo_name: erdoganfurkan/HelioAI
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User guide:
      - Interfaces: guide/interfaces.md
      - Agent tools: guide/tools.md
      - Recipes and provenance: guide/recipes.md
      - Reproducible export: guide/export.md
  - Developer guide:
      - Architecture: dev/architecture.md
      - Extending HelioAI: dev/extending.md
      - Dependency policy: dev/dependencies.md
  - API reference:
      - Tools: reference/tools.md
      - Core: reference/core.md
      - Interfaces: reference/interfaces.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/erdoganfurkan/HelioAI

watch:
  - helioai

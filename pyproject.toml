[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helioai"
version = "0.1.0"
description = "AI agent for heliophysics and space plasma data analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Furkan Erdogan", email = "furkan.erdogan.pro@gmail.com" }]
keywords = ["heliophysics", "plasma", "space physics", "AI agent", "MCP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "speasy>=1.4",
    "plasmapy>=2024.5",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "google-genai>=0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "scipy>=1.12",
    "astropy>=6.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "rank-bm25>=0.2",
    "geopack>=1.0.11",
]

[project.urls]
Homepage = "https://github.com/erdoganfurkan/HelioAI"
Repository = "https://github.com/erdoganfurkan/HelioAI"
Issues = "https://github.com/erdoganfurkan/HelioAI/issues"

[project.optional-dependencies]
solarmach = ["solarmach>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx2>=0.28",
]

[tool.uv]
# torch is transitive (sentence-transformers). Left alone, the universal resolve
# settles on 2.4.1, which ships no cp313/cp314 wheels and so breaks `uv sync` on
# the Python versions PHEP 3 requires us to test. This is a lockfile concern
# only — it is deliberately not a `dependencies` entry, since HelioAI never
# imports torch and PyPI users should resolve it themselves.
constraint-dependencies = ["torch>=2.6"]

[project.scripts]
helioai = "helioai.interfaces.cli:main"
helioai-mcp = "helioai.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["helioai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=helioai --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = [
    "helioai/core/llm/gemini.py",
    "helioai/interfaces/cli.py",
    "helioai/interfaces/web/app.py",
    "helioai/logging_config.py",
    "helioai/tools/setup.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Recipes are snippets exec'd inside the sandbox with an injected namespace
# (`export`, the loaded parameters, ...), so they are undefined-name by design.
exclude = ["helioai/data/recipes/", "data/", "tasks/"]

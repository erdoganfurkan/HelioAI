[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name only; the import package stays `helioai`. PyPI rejects "helioai"
# as confusable with the existing "helloai": it folds l/i to 1 and o to 0, so both
# names reduce to he110a1.
name = "helioai-agent"
dynamic = ["version"]
description = "AI agent for heliophysics and space plasma data analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Furkan Erdogan", email = "furkan.erdogan.pro@gmail.com" }]
keywords = ["heliophysics", "plasma", "space physics", "AI agent", "MCP"]
classifiers = [
    # Beta, not Alpha: a published package with a documentation site, a security
    # policy, a provenance ledger and a thousand tests undersold itself.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # The sandbox is only real on Linux (SECURITY.md); the other two run the fallback.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Framework :: Jupyter",
    "Typing :: Typed",
]
dependencies = [
    "speasy>=1.4",
    "plasmapy>=2026.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # torch is only reached through sentence-transformers, but the floor has to be ours:
    # transformers 5 needs torch>=2.5 and declares it in no core requirement, so a resolver
    # that backtracks torch to dodge an unrelated conflict (mpmath 1.4 vs sympy's <1.4 cap —
    # uv does, pip does not) installs a torch transformers then disables, and the dense
    # search dies at import with no error at the tool boundary. 2.6 is also the first
    # torch with cp313/cp314 wheels.
    "torch>=2.6",
    "openai>=1.30",
    "google-genai>=0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "mcp>=2.0",
    # Imported directly by tools/mcp_client.py: the SDK's streamable-HTTP client is
    # typed on httpx2.AsyncClient, so the plain httpx client cannot be handed to it.
    # It arrives through mcp anyway; declaring it means a future mcp that drops it
    # fails at resolution, not at import.
    "httpx2>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "numpy>=2.2",
    "matplotlib>=3.10",
    "pillow>=10",
    "scipy>=1.15",
    "astropy>=6.0",
    "ipython>=8.28",
    "ipywidgets>=8.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "rank-bm25>=0.2",
    "geopack>=1.0.11",
]

[project.urls]
Homepage = "https://github.com/erdoganfurkan/HelioAI"
Repository = "https://github.com/erdoganfurkan/HelioAI"
Issues = "https://github.com/erdoganfurkan/HelioAI/issues"

[project.optional-dependencies]
solarmach = ["solarmach>=0.5"]
judgment = ["typesafe-sdk>=0.7"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
helioai = "helioai.interfaces.cli:main"
helioai-mcp = "helioai.mcp_server:main"

[tool.hatch.version]
# Single source of truth: helioai/__init__.py
path = "helioai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["helioai"]

[tool.hatch.build.targets.sdist]
# Explicit selection. The default — everything not gitignored — swept whatever
# untracked files were sitting in the working tree into the tarball (review
# reports, .opencode/node_modules: 5 MB), so a locally built sdist was one
# manual `twine upload` away from publishing them. CI builds from a clean
# checkout and never hit this; the list makes local and CI builds identical.
only-include = [
    "helioai",
    "tests",
    "docs",
    "examples",
    "scripts",
    "docker",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "SECURITY.md",
    "mkdocs.yml",
    ".env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "recipes: executes the shipped scientific recipes with synthetic inputs (-m 'not recipes' to skip)",
    "network: touches the real network (-m 'not network' to skip)",
    "slow: takes more than a few seconds",
]
addopts = "--cov=helioai --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["helioai"]
# No omit list. Measuring only the modules you already test tells you nothing;
# the excluded set turned out to include tools/setup.py at 100% and
# interfaces/web/app.py at 76%, while genuinely thin modules were never on it.

[tool.ruff]
line-length = 100
target-version = "py312"
# Recipes are snippets exec'd inside the sandbox with an injected namespace
# (`export`, the loaded parameters, ...), so they are undefined-name by design.
exclude = [
    "helioai/data/recipes/",
    # Prompt assets, not source. ruff 0.16 started reformatting Python blocks
    # inside Markdown, which silently rewrites the text the model is shown —
    # and prompt wording is functional here, not cosmetic.
    "helioai/core/skills/",
    "data/",
    "tasks/",
]

[tool.ruff.lint]
# Pinned explicitly. Leaving this unset inherits ruff's built-in defaults, which
# widened between 0.9 and 0.16 and broke CI on a routine dependency bump — the
# lint config must not depend on which ruff happens to resolve.
#
# Deliberately NOT selected:
#   BLE, S110  broad excepts are the design: a failing tool must degrade to an
#              error string, never kill the agent loop mid-conversation.
#   S102       the sandbox and the recipe loader run exec() on purpose.
#   PLW1510    subprocess calls whose return code is handled explicitly.
#   SIM        stylistic rewrites only; not worth churning code we are not
#              otherwise touching.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI expresses dependencies as call-in-default: Depends(...)
    "B904",  # tool errors are returned as values, not re-raised from context
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helioai"
dynamic = ["version"]
description = "AI agent for heliophysics and space plasma data analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Furkan Erdogan", email = "furkan.erdogan.pro@gmail.com" }]
keywords = ["heliophysics", "plasma", "space physics", "AI agent", "MCP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "speasy>=1.4",
    "plasmapy>=2024.5",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "google-genai>=0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    # Capped: mcp 2.0 is a breaking rewrite of BOTH surfaces HelioAI uses — the
    # client lost `streamablehttp_client(headers=...)` and its 3-tuple yield, and
    # the server lost the @server.list_tools()/@server.call_tool() decorators
    # entirely. PHEP 3 allows an upper bound when genuinely necessary; migrating
    # mcp_server.py is tracked separately and this cap comes off with it.
    "mcp>=1.0,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "numpy>=2.1",
    "matplotlib>=3.10",
    "pillow>=10",
    "scipy>=1.15",
    "astropy>=6.0",
    "ipython>=8.27",
    "ipywidgets>=8.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "rank-bm25>=0.2",
    "geopack>=1.0.11",
]

[project.urls]
Homepage = "https://github.com/erdoganfurkan/HelioAI"
Repository = "https://github.com/erdoganfurkan/HelioAI"
Issues = "https://github.com/erdoganfurkan/HelioAI/issues"

[project.optional-dependencies]
solarmach = ["solarmach>=0.5"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.uv]
# torch is transitive (sentence-transformers). Left alone, the universal resolve
# settles on 2.4.1, which ships no cp313/cp314 wheels and so breaks `uv sync` on
# the Python versions PHEP 3 requires us to test. This is a lockfile concern
# only — it is deliberately not a `dependencies` entry, since HelioAI never
# imports torch and PyPI users should resolve it themselves.
constraint-dependencies = ["torch>=2.6"]

[project.scripts]
helioai = "helioai.interfaces.cli:main"
helioai-mcp = "helioai.mcp_server:main"

[tool.hatch.version]
# Single source of truth: helioai/__init__.py
path = "helioai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["helioai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=helioai --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["helioai"]
# No omit list. Measuring only the modules you already test tells you nothing;
# the excluded set turned out to include tools/setup.py at 100% and
# interfaces/web/app.py at 76%, while genuinely thin modules were never on it.

[tool.ruff]
line-length = 100
target-version = "py312"
# Recipes are snippets exec'd inside the sandbox with an injected namespace
# (`export`, the loaded parameters, ...), so they are undefined-name by design.
exclude = [
    "helioai/data/recipes/",
    # Prompt assets, not source. ruff 0.16 started reformatting Python blocks
    # inside Markdown, which silently rewrites the text the model is shown —
    # and prompt wording is functional here, not cosmetic.
    "helioai/core/skills/",
    "data/",
    "tasks/",
]

[tool.ruff.lint]
# Pinned explicitly. Leaving this unset inherits ruff's built-in defaults, which
# widened between 0.9 and 0.16 and broke CI on a routine dependency bump — the
# lint config must not depend on which ruff happens to resolve.
#
# Deliberately NOT selected:
#   BLE, S110  broad excepts are the design: a failing tool must degrade to an
#              error string, never kill the agent loop mid-conversation.
#   S102       the sandbox and the recipe loader run exec() on purpose.
#   PLW1510    subprocess calls whose return code is handled explicitly.
#   SIM        stylistic rewrites only; not worth churning code we are not
#              otherwise touching.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI expresses dependencies as call-in-default: Depends(...)
    "B904",  # tool errors are returned as values, not re-raised from context
]
